<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Neon Rift</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
<style>
:root{--bg:#0a0820;--ink:#e9e7ff;--cy:#3df5ff;--mg:#ff3d9a;--am:#ffc83d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
@media(prefers-color-scheme:dark){:root{--bg:#0a0820}}
*{box-sizing:inherit}html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif;overflow:hidden;touch-action:none}
canvas{display:block;width:100%;height:100%}
#ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;background:rgba(10,8,32,.72);backdrop-filter:blur(4px);padding:24px}
#ui.hide{display:none}
h1{margin:0;font-size:clamp(40px,10vw,84px);letter-spacing:.04em;background:linear-gradient(90deg,var(--cy),var(--mg));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(61,245,255,.45))}
p{margin:0;max-width:34ch;line-height:1.5;opacity:.85}
button{font:inherit;font-weight:700;font-size:18px;padding:14px 38px;border:0;border-radius:999px;background:var(--cy);color:#06121a;cursor:pointer;box-shadow:0 0 28px rgba(61,245,255,.5);transition:transform .15s}
button:hover{transform:scale(1.06)}button:focus-visible{outline:3px solid var(--am);outline-offset:3px}
#hud{position:fixed;top:max(12px,env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;font-weight:700;pointer-events:none;text-shadow:0 0 10px var(--cy)}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><span id="sc">Score 0</span><span id="cb"></span><span id="hs">Best 0</span></div>
<div id="ui"><h1 id="t">NEON RIFT</h1><p id="m">Drag, tap or use ← → to steer. Grab cyan shards, dodge pink blocks. Speed climbs every few seconds.</p><button id="go">Launch</button></div>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d'),ui=document.getElementById('ui'),$=i=>document.getElementById(i);
let W,H,D;function fit(){D=Math.min(devicePixelRatio||1,2);W=cv.width=innerWidth*D;H=cv.height=innerHeight*D}addEventListener('resize',fit);fit();
let best=0;try{best=+localStorage.getItem('nr_best')||0}catch(e){}
$('hs').textContent='Best '+best;
let s,keys={},tx=null,stars=[];
for(let i=0;i<90;i++)stars.push({x:Math.random(),y:Math.random(),z:Math.random()*2+.3});
function reset(){s={p:{x:W/2,y:H*.82,r:16*D},o:[],f:[],g:[],sc:0,t:0,sp:4.2*D,cb:0,run:true,sh:0}}
addEventListener('keydown',e=>{keys[e.key]=1});addEventListener('keyup',e=>{keys[e.key]=0});
const mv=e=>{tx=(e.touches?e.touches[0].clientX:e.clientX)*D};
addEventListener('pointermove',mv);addEventListener('pointerdown',mv);addEventListener('touchmove',mv,{passive:true});
function boom(px,py,c,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=(Math.random()*4+1)*D;s.f.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,c})}}
function spawn(){const r=Math.random(),w=(40+Math.random()*50)*D;
 if(r<.55)s.o.push({k:'b',x:Math.random()*(W-w),y:-w,w,h:w});
 else s.o.push({k:'s',x:Math.random()*(W-60*D)+30*D,y:-30*D,w:20*D,h:20*D,a:0})}
function step(){
 s.t++;s.sp+=.0016*D;
 const p=s.p;
 if(keys.ArrowLeft||keys.a)p.x-=9*D;if(keys.ArrowRight||keys.d)p.x+=9*D;
 if(tx!==null)p.x+=(tx-p.x)*.22;
 p.x=Math.max(p.r,Math.min(W-p.r,p.x));
 if(s.t%Math.max(14,Math.floor(34-s.sp/D*2.2))===0)spawn();
 for(const o of s.o){o.y+=s.sp*(o.k==='s'?.85:1);o.a+=.08;
  const cx=Math.max(o.x,Math.min(p.x,o.x+o.w)),cy=Math.max(o.y,Math.min(p.y,o.y+o.h));
  if((p.x-cx)**2+(p.y-cy)**2<(p.r*(o.k==='s'?1.3:.8))**2){
   if(o.k==='s'){o.dead=1;s.cb++;s.sc+=10*Math.min(s.cb,10);boom(o.x+o.w/2,o.y+o.h/2,'#3df5ff',14)}
   else{s.run=false;s.sh=18;boom(p.x,p.y,'#ff3d9a',60);boom(p.x,p.y,'#ffc83d',30);end()}}
  if(o.y>H){if(o.k==='s'&&!o.dead)s.cb=0;o.dead=1}}
 s.o=s.o.filter(o=>!o.dead);
 s.sc+=.05*s.sp/D;
 s.g.push({x:p.x,y:p.y+p.r,l:1});if(s.g.length>22)s.g.shift();
}
function end(){const f=Math.floor(s.sc);if(f>best){best=f;try{localStorage.setItem('nr_best',best)}catch(e){}}
 $('hs').textContent='Best '+best;
 setTimeout(()=>{$('t').textContent='CRASHED';$('m').textContent='Score '+f+(f>=best?' — new best!':'')+'. Fly again?';$('go').textContent='Retry';ui.classList.remove('hide')},900)}
function draw(){
 x.fillStyle='#0a0820';x.fillRect(0,0,W,H);
 const g=x.createRadialGradient(W/2,H,0,W/2,H,H);g.addColorStop(0,'rgba(255,61,154,.22)');g.addColorStop(1,'transparent');x.fillStyle=g;x.fillRect(0,0,W,H);
 const sp=s?s.sp:3*D;
 for(const t of stars){t.y+=t.z*sp*.004;if(t.y>1)t.y=0;x.fillStyle='rgba(233,231,255,'+(.25+t.z*.25)+')';x.fillRect(t.x*W,t.y*H,t.z*1.6*D,t.z*3*D)}
 if(!s)return;
 if(s.sh>0){x.save();x.translate((Math.random()-.5)*s.sh*D,(Math.random()-.5)*s.sh*D);s.sh--}else x.save();
 s.g.forEach((q,i)=>{x.fillStyle='rgba(61,245,255,'+i/60+')';x.beginPath();x.arc(q.x,q.y+(22-i)*2*D,(i/3)*D,0,6.28);x.fill()});
 for(const o of s.o){
  if(o.k==='b'){x.shadowColor='#ff3d9a';x.shadowBlur=22*D;x.fillStyle='#ff3d9a';x.fillRect(o.x,o.y,o.w,o.h);x.fillStyle='#0a0820';x.fillRect(o.x+5*D,o.y+5*D,o.w-10*D,o.h-10*D)}
  else{x.shadowColor='#3df5ff';x.shadowBlur=24*D;x.fillStyle='#3df5ff';x.save();x.translate(o.x+o.w/2,o.y+o.h/2);x.rotate(o.a);x.beginPath();for(let i=0;i<4;i++){x.lineTo(Math.cos(i*1.57)*o.w*.8,Math.sin(i*1.57)*o.w*.8)}x.fill();x.restore()}}
 x.shadowBlur=0;
 for(const f of s.f){f.x+=f.vx;f.y+=f.vy;f.l-=.025;x.globalAlpha=Math.max(f.l,0);x.fillStyle=f.c;x.fillRect(f.x,f.y,3*D,3*D)}x.globalAlpha=1;
 if(s.run){const p=s.p;x.shadowColor='#3df5ff';x.shadowBlur=26*D;x.fillStyle='#e9e7ff';x.beginPath();x.moveTo(p.x,p.y-p.r*1.4);x.lineTo(p.x+p.r,p.y+p.r);x.lineTo(p.x,p.y+p.r*.5);x.lineTo(p.x-p.r,p.y+p.r);x.fill();x.shadowBlur=0}
 x.restore();
 $('sc').textContent='Score '+Math.floor(s.sc);$('cb').textContent=s.cb>1?'Combo ×'+Math.min(s.cb,10):'';
}
let run=false;
function loop(){if(run&&s&&s.run)step();else if(s)for(const f of s.f){}draw();requestAnimationFrame(loop)}
$('go').onclick=()=>{reset();ui.classList.add('hide');run=true};
reset();s.run=false;loop();
</script></body></html>
