<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%">
<defs>
<linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#3df5ff"/><stop offset="1" stop-color="#ff3d9a"/></linearGradient>
<radialGradient id="r" cx=".5" cy="1" r="1"><stop offset="0" stop-color="#ff3d9a" stop-opacity=".35"/><stop offset="1" stop-color="#0a0820" stop-opacity="0"/></radialGradient>
<filter id="b"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect width="1200" height="360" fill="#0a0820"/><rect width="1200" height="360" fill="url(#r)"/>
<g fill="#e9e7ff" opacity=".6">
<rect x="80" y="-20" width="2" height="12"><animate attributeName="y" from="-20" to="380" dur="2.4s" repeatCount="indefinite"/></rect>
<rect x="260" y="-20" width="2" height="16"><animate attributeName="y" from="-20" to="380" dur="1.6s" repeatCount="indefinite"/></rect>
<rect x="470" y="-20" width="2" height="10"><animate attributeName="y" from="-20" to="380" dur="3s" repeatCount="indefinite"/></rect>
<rect x="820" y="-20" width="2" height="14"><animate attributeName="y" from="-20" to="380" dur="2s" repeatCount="indefinite"/></rect>
<rect x="1010" y="-20" width="2" height="12"><animate attributeName="y" from="-20" to="380" dur="2.8s" repeatCount="indefinite"/></rect>
<rect x="1140" y="-20" width="2" height="16"><animate attributeName="y" from="-20" to="380" dur="1.9s" repeatCount="indefinite"/></rect>
</g>
<rect x="160" y="-60" width="46" height="46" fill="none" stroke="#ff3d9a" stroke-width="4" filter="url(#b)"><animate attributeName="y" from="-60" to="400" dur="4s" repeatCount="indefinite"/></rect>
