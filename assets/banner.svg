<text x="600" y="190" text-anchor="middle" font-family="Trebuchet MS,Arial,sans-serif" font-weight="800" font-size="120" letter-spacing="6" fill="url(#g)">NEON RIFT</text>
<text x="600" y="240" text-anchor="middle" font-family="Trebuchet MS,Arial,sans-serif" font-size="26" fill="#e9e7ff" opacity=".85">Dodge. Collect. Drift deeper.</text>
<g transform="translate(600,300)"><path d="M0-24L18 18 0 8-18 18z" fill="#e9e7ff"><animateTransform attributeName="transform" type="translate" values="-60,0;60,0;-60,0" dur="3s" repeatCount="indefinite"/></path></g>
